[project]
name = "backend"
version = "0.1.0"
description = "FAQ regression eval API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-openai>=0.7.0",
    "openai>=3.41.0",
    "pydantic>=2.14.2",
]

[dependency-groups]
dev = [
    "deepeval>=4.3.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
